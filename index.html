<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="life">
<meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=3">
<title>life</title>
<style>
:root{
  --bg:#f4f2ee;--card:#ffffff;--ink:#1c1b19;--muted:#7a756c;--line:#e7e3db;--fill:#efece6;
  --accent:#1f7a5c;--accent-ink:#ffffff;--soft:#e4f1ea;--cc:#f46f2e;--cc-btn:#f46f2e;--cc-soft:#fde9e0;--bofa:#092166;--bofa-btn:#092166;--bofa-soft:#dfe2ec;--danger:#b23a2b;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121211;--card:#1c1b19;--ink:#eeebe5;--muted:#9a958c;--line:#2c2a27;--fill:#262522;
  --accent:#4cc293;--accent-ink:#0d1f17;--soft:#1d3329;--cc:#f7894f;--cc-btn:#f46f2e;--cc-soft:#3a2418;--bofa:#9fb2ec;--bofa-btn:#2f4fb3;--bofa-soft:#18213d;--danger:#f07a68;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;font-size:16px;text-transform:lowercase}
body,button{text-transform:lowercase}
main{max-width:560px;margin:0 auto;padding:0 16px 24px}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:14px 0 10px}
.icon{width:44px;height:44px;border-radius:22px;font-size:28px;line-height:1;color:var(--muted);display:grid;place-items:center}
.icon:active{background:var(--fill)}
.icon:disabled{opacity:.25}
.when{flex:1;text-align:center}
.when-l{font-size:22px;font-weight:700;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:8px}
.hl{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.hd small .hl{width:8px;height:8px;margin-right:3px;vertical-align:0}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin:4px 0 8px}
.swatch{width:44px;height:44px;border-radius:50%;border:2px solid transparent}
.swatch.on{border-color:var(--ink)}
.swatch.none{background:var(--fill);color:var(--muted);font-size:20px}
.when-d{font-size:13px;color:var(--muted)}
.ttl{font-size:28px;font-weight:750;letter-spacing:-.02em;margin:0}
.jump{display:block;margin:-2px auto 10px;font-size:13px;font-weight:600;color:var(--accent);background:var(--soft);padding:6px 12px;border-radius:99px}

/* cards */
.card{background:var(--card);border-radius:18px;padding:6px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:650;letter-spacing:.01em;color:var(--muted);margin:10px 0 2px}
.row{display:flex;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .k{flex:0 0 84px;color:var(--muted);font-size:15px}
.row .v{flex:1;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v.ph{color:var(--muted);font-weight:400}
.chev{color:var(--muted);font-size:20px}
.inl{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;font-weight:550}
.inl::placeholder,textarea::placeholder{color:var(--muted);font-weight:400;opacity:.8}
.hint{font-size:13px;color:var(--muted);padding:10px 0 12px}
.whint{font-size:13px;color:var(--muted);white-space:nowrap}

/* spend */
.spend{padding:12px}
.spend-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spend-btn{position:relative;text-align:left;border-radius:14px;padding:12px 14px 14px;background:var(--cc-soft)}
.spend-btn.bo{background:var(--bofa-soft)}
.spend-btn .k{display:block;font-size:13px;font-weight:650;color:var(--cc)}
.spend-btn.bo .k{color:var(--bofa)}
.spend-btn .v{display:block;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.spend-btn .plus{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:15px;background:var(--cc-btn);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:600;line-height:1}
.spend-btn.bo .plus{background:var(--bofa-btn);color:#fff}
.spend-btn .plus svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round}
.spend-btn:active{transform:scale(.98)}
.entries{list-style:none;margin:8px 2px 0;padding:0}
.entries li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--cc-soft);color:var(--cc)}
.tag.bo{background:var(--bofa-soft);color:var(--bofa)}
.entries .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entries .amt{font-weight:600}
.x{width:32px;height:32px;border-radius:16px;color:var(--muted);font-size:20px}
.x:active{background:var(--fill)}

/* controls */
.stepper{margin-left:auto;display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:36px;border-radius:10px;background:var(--fill);display:grid;place-items:center}
.stepper button svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round}
.stepper .sv{min-width:56px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}
.switch{margin-left:auto;width:52px;height:32px;border-radius:16px;background:var(--fill);position:relative;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on i{transform:translateX(20px)}
textarea{width:100%;border:0;background:transparent;outline:none;resize:none;padding:4px 0 12px;min-height:72px;line-height:1.45}

/* month */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.tile .s{font-size:12px;color:var(--muted)}
.tile.tap{display:block;text-align:left;width:100%;font:inherit;align-self:stretch}
.tile.tap:active{background:var(--fill)}
#cclist,#bolist{scroll-margin-top:12px}
.h2n{float:right;font-weight:500;color:var(--muted);font-size:12px}
.tile.cc .v{color:var(--cc)} .tile.bo .v{color:var(--bofa)}
.bars{--cc-bar:color-mix(in srgb,var(--cc) 85%,var(--card));display:flex;align-items:flex-end;gap:2px;height:132px;padding:22px 0 0 34px;position:relative}
.bar{flex:1;height:100%;display:flex;align-items:flex-end;border-radius:3px;position:relative}
.maxlbl{position:absolute;left:50%;bottom:calc(var(--h)*100% + 3px);transform:translateX(-50%);font-size:11px;font-weight:650;color:var(--ink);white-space:nowrap;pointer-events:none}
.avgline{position:absolute;left:29px;right:0;height:0;border-top:1.5px dashed color-mix(in srgb,var(--muted) 60%,transparent);pointer-events:none;z-index:2}
.avgline span{position:absolute;left:-29px;top:0;transform:translateY(-50%);font-size:10px;font-weight:600;line-height:1;color:var(--muted);white-space:nowrap}
.maxlbl.l{left:0;transform:none}.maxlbl.r{left:auto;right:0;transform:none}
.bar::after{content:"";display:block;width:100%;height:calc(var(--h)*100%);min-height:2px;background:var(--bc, var(--cc-bar));border-radius:3px}
.bar.zero::after{background:var(--line);opacity:1}
.bar.over::after{background:linear-gradient(var(--ink) 0 3px,var(--bc, var(--cc-bar)) 3px)}
.bar.fut::after{background:transparent}
.bar.sel::after{outline:2px solid var(--ink);outline-offset:1px}
.trips{position:relative;height:16px;margin:4px 0 0 34px}
.trips span{position:absolute;top:0;text-align:center;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;border-top:3px solid var(--bc);border-radius:2px;padding-top:2px;line-height:1.1;overflow:visible;display:flex;justify-content:center}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:4px 0 10px 34px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.lrow{display:flex;gap:10px;align-items:baseline;padding:10px 0;width:100%;text-align:left;font-size:15px}
.lrow .d{flex:0 0 52px;color:var(--muted);font-size:13px}
.lrow .t{flex:1;min-width:0}
.lrow .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .a{font-weight:650}
.spots{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 12px}
.spot{background:var(--fill);border-radius:99px;padding:5px 11px;font-size:14px}
.spot b{color:var(--muted);font-weight:600;margin-left:4px}
.ytd{text-align:center;font-size:13px;color:var(--muted);margin:6px 0 0}
.muted{color:var(--muted)}

/* history */
.search{width:100%;border:0;border-radius:12px;background:var(--fill);padding:11px 14px;outline:none;margin-bottom:6px}
.mh{font-size:14px;font-weight:650;color:var(--muted);margin:18px 4px 6px;display:flex;justify-content:space-between}
.mh span{font-weight:500}
.hrow{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);padding:10px 14px;border-bottom:1px solid var(--line)}
.hgroup{border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.hgroup .hrow:last-child{border-bottom:0}
.hrow:active{background:var(--fill)}
.hd{flex:0 0 38px;text-align:center}
.hd b{display:block;font-size:19px;line-height:1.1}
.hd small{font-size:11px;color:var(--muted);white-space:nowrap}
.hm{flex:1;min-width:0;align-self:center}
.hm .nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.hm .nt.none{color:var(--muted)}
.hm .l1,.hm .l2{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm .l1{font-size:15px;font-weight:550}
.hm .l2{font-size:13px;color:var(--muted)}
.hr{text-align:right;font-size:14px;font-weight:650;display:flex;flex-direction:column;align-items:flex-end}
.hr .bo{color:var(--bofa)}
.hr small{font-weight:400;color:var(--muted);font-size:12px}
.gsum{color:var(--muted);font-size:14px;margin:-4px 4px 12px}
.veh{padding:0 16px}
.vhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 0}
.paint{flex:0 0 16px;height:16px;border-radius:50%;background:var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.vmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.vn{font-size:16px;font-weight:700}
.plate{flex:0 0 auto;width:82px;height:42px;border:1.5px solid #1c1b19;border-radius:4px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-transform:none}
.plate small{font-size:6.5px;font-weight:800;letter-spacing:.06em;color:#d0352b;line-height:1}
.plate b{font-size:17px;font-weight:800;color:#13305e;line-height:1;letter-spacing:.01em}
.plate b.long{font-size:15px}
.plate.classic{background:#f8f0dc}
.plate.classic small,.plate.classic b{color:#1c1b19}
.vs{display:flex;align-items:baseline;column-gap:7px;flex-wrap:wrap}
.vc{font-size:20px;font-weight:750;letter-spacing:-.02em}
.vs small{color:var(--muted);font-size:12px;white-space:nowrap}
.vbody{border-top:1px solid var(--line);padding:4px 0 8px}
.vrow{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:8px 0;font-size:14px}
.vrow .k{width:44px;color:var(--muted);font-size:12px;font-weight:600}
.vrow .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.02em}
.vrow .cp{margin-left:auto;color:var(--accent);font-size:12px;font-weight:650}
.vrow.note{color:var(--muted);font-size:13px;padding:2px 0 6px 54px}
.parts{margin-top:6px;border-top:1px solid var(--line)}
.prow{display:flex;gap:10px;align-items:baseline;padding:9px 0;font-size:14px}
.prow .pn{flex:1;min-width:0}
.prow .pa{color:var(--muted);font-size:12px;white-space:nowrap}
.prow .pa.old{color:var(--cc);font-weight:600}
.prow .pp{width:62px;text-align:right;font-weight:650;white-space:nowrap}
.prow.base .pn{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 0}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 88%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-radius:20px 20px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;max-height:85vh;overflow:auto;
  max-width:560px;margin:0 auto;visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.sheet.open{transform:none;visibility:visible;transition:transform .22s ease}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-h{font-size:17px;font-weight:700;margin:0 0 12px}
.amt-wrap{display:flex;align-items:center;gap:4px;font-size:36px;font-weight:700;border-bottom:2px solid var(--cc);margin-bottom:12px}
.amt-wrap.bo{border-color:var(--bofa)}
.amt-wrap span{color:var(--muted)}
.amt-wrap input{flex:1;min-width:0;border:0;background:transparent;font-size:36px;font-weight:700;outline:none;padding:4px 0;font-variant-numeric:tabular-nums}
.amt-wrap input.bad{color:var(--danger)}
.field{width:100%;border:0;border-radius:12px;background:var(--fill);padding:12px 14px;outline:none;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--fill);border-radius:99px;padding:8px 13px;font-size:15px;font-weight:550}
.chip small{color:var(--muted);font-weight:500;margin-left:2px}
.chip:active,.chip.on{background:var(--accent);color:var(--accent-ink)}
.chips.bo .chip:active,.chips.bo .chip.on{background:var(--bofa-btn);color:#fff}
.chip.on small{color:inherit}
.chips.big .chip{padding:10px 14px}
.chip.dash{color:var(--muted)}
.chip.dash.on{color:var(--accent-ink)}
.chip.wild{background:#fff2cc;color:#1c1b19}
.chip.wild small{color:#6e6250;font-weight:500;margin-left:2px}
.chip.wild.on,.chip.wild:active{background:var(--accent);color:var(--accent-ink)}
.primary,.secondary,.danger,.ghostbtn{display:block;width:100%;border-radius:14px;padding:14px;font-weight:650;text-align:center;margin-top:8px}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary.cc{background:var(--cc-btn);color:#fff}
.primary.bo{background:var(--bofa-btn);color:#fff}
.secondary{background:var(--fill)}
.danger{color:var(--danger);background:transparent;margin-top:18px}
.ghostbtn{background:var(--fill);color:var(--muted)}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.small{font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .2s;z-index:60;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.syncline{display:block;margin:-6px auto 10px;font-size:12px;color:var(--muted);padding:2px 10px}
.syncline.err{color:var(--danger)}
.sync-h{font-size:15px;font-weight:700;margin:22px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
.bills{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 2px 2px}
.bills-k{font-size:12px;font-weight:600;color:var(--muted);margin-right:2px}
.bill{font-size:13px;font-weight:650;padding:5px 11px;border-radius:99px;border:1.5px solid var(--bofa);color:var(--bofa)}
.bill:active{background:var(--bofa-soft)}
.bill.sub{border-color:var(--cc);color:var(--cc)}
.bill.sub:active{background:var(--cc-soft)}
.bill small{font-weight:500;opacity:.8}
.backup-nudge{display:block;width:100%;text-align:center;font-size:13px;color:var(--muted);padding:6px 0}
.backup-nudge b{color:var(--accent)}
</style>
</head>
<body>
<main id="main"></main>

<nav><div class="in">
  <button class="tab" data-view="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>today</button>
  <button class="tab" data-view="month"><svg viewBox="0 0 24 24"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>month</button>
  <button class="tab" data-view="history"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>history</button>
  <button class="tab" data-view="garage"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 4l8.5 6.5V20h-17z"/><path d="M7.5 20v-6.5h9V20M7.5 16.5h9"/></svg>garage</button>
  <!-- data tab hidden; ask Claude to bring it back when adding a device -->
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,.csv,.tsv,.txt,application/json,text/csv" hidden>

<script>
(function(){
'use strict';
const KEY = 'daily.v1';
const MON = ['january','february','march','april','may','june','july','august','september','october','november','december'];
const DOW = ['sun','mon','tue','wed','thu','fri','sat'];
const DEF = {
  cc: [{n:'visible',a:2500},{n:'claude',a:2000},{n:'google',a:299},{n:'gas'},{n:'groceries'},{n:'amazon'}],
  bo: [{n:'mortgage'},{n:'og&e'},{n:'ok natural gas'},{n:'okc utilities'},{n:'at&t fiber'},{n:'cash'}]
};
const DEF_MEALS = ['braums','chick fil a','jersey mikes','golden chick','pollo campero','canes'];

const $ = s => document.querySelector(s);
const main = $('#main'), sheet = $('#sheet'), sheetBody = $('#sheetBody'), scrim = $('#scrim');
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => iso(new Date());
const fromISO = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = fromISO(k); d.setDate(d.getDate() + n); return iso(d); };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmt$0 = c => '$' + Math.round(c / 100).toLocaleString('en-US');
const short = k => { const d = fromISO(k); return MON[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); };

/* ---------- storage ---------- */

  for (const k in S.days) if (blank(S.days[k])) delete S.days[k];

}

}

/* ---------- month ---------- */

function firstMonth(){ const ks = Object.keys(S.days).sort(); return (ks[0] || todayISO()).slice(0, 7); }
function monthHTML(){
  const [y, m] = selMonth.split('-').map(Number);
  const dim = new Date(y, m, 0).getDate(), t = todayISO(), curM = t.slice(0, 7);

  const bo = days.reduce((a, [, d]) => a + sum(d.bo), 0);
  const sl = days.map(([, d]) => d.s).filter(v => v != null);

  const yrAvg = String(y) <= t.slice(0, 4) && yrDays > 0 ? yrCC / yrDays : 0;
  const trips = [];
  days.forEach(([, d], i) => { if (!d.hl || !d.trip) return; const last = trips[trips.length - 1]; if (last && last.name === d.trip && last.i + last.n === i) last.n++; else trips.push({name: d.trip, c: d.hl, i, n: 1}); });
  const maxV = Math.max(...vals), maxI = maxV > 0 ? vals.indexOf(maxV) : -1;
  const avgDay = elapsed ? cc / elapsed : 0;

    <div class="trips">${trips.map(r => `<span style="left:${(r.i / dim * 100).toFixed(2)}%;width:${(r.n / dim * 100).toFixed(2)}%;--bc:${r.c}">${esc(r.name)}</span>`).join('')}</div>

  ${boList.length ? `<section class="card" id="bolist"><h2>bofa</h2><ul class="list">${boList.map(o => `
    <li><button class="lrow" data-act="goday" data-k="${o.k}"><span class="d">${short(o.k)}</span>

/* ---------- history ---------- */
function hay(k){
  const d = S.days[k];

function historyHTML(){
  return `<header class="top"><h1 class="ttl">history</h1></header>

  <div id="hlist">${histList()}</div>`;
}
function histList(){
  const qq = q.trim().toLowerCase();
  const now = todayISO();
  const ks = Object.keys(S.days).sort().reverse().filter(k => k <= now && (!qq || hay(k).includes(qq)));
  if (!ks.length) return `<p class="empty">${qq ? 'nothing matches.' : 'no days logged yet.<br>import your history from the data tab.'}</p>`;
  const groups = [];
  for (const k of ks) { const mk = k.slice(0, 7); if (!groups.length || groups[groups.length - 1].mk !== mk) groups.push({mk, ks: []}); groups[groups.length - 1].ks.push(k); }
  return groups.map(g => {

        <span class="hm"><span class="nt${d.notes ? '' : ' none'}">${esc(d.notes || '—')}</span></span>

/* ---------- garage (read-only copy of the sheet's "vehicles" tab) ---------- */
let openVeh = {};
const gMoney = v => { const n = parseFloat(String(v || '').replace(/[$,\s]/g, '')); return isNaN(n) ? null : Math.round(n * 100); };
function sheetDate(v){
  const m = String(v || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (!m) return null;
  const y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
  return y + '-' + pad(+m[1]) + '-' + pad(+m[2]);
}
function ageOf(k){
  if (!k) return {txt: '', y: 0};
  const a = fromISO(k), b = fromISO(todayISO());
  let y = b.getFullYear() - a.getFullYear(), m = b.getMonth() - a.getMonth(), d = b.getDate() - a.getDate();
  if (d < 0) { m--; d += new Date(b.getFullYear(), b.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  if (y < 0) return {txt: 'not yet', y: 0};
  const txt = y ? y + 'y' + (m ? ' ' + m + 'm' : '') : m ? m + 'm' + (d ? ' ' + d + 'd' : '') : d + 'd';
  return {txt, y: y + m / 12};
}
// Reads the vehicles tab: a row whose name starts with a year is a vehicle ("1988 suzuki samurai - VIN", "... sold"),
// the rows under it are its parts. Column H under a vehicle holds state, then plate, then notes; column K holds the title number.
function parseGarage(rows){
  const out = []; let cur = null;
  for (const r of rows || []) {
    const c = i => String((r || [])[i] ?? '').trim();
    const name = c(1), price = gMoney(c(2)), date = sheetDate(c(3)), h = c(7);
    if (/^(19|20)\d\d\s/.test(name)) {
      const sold = /\bsold\s*$/i.test(name);
      const [title, vin] = name.replace(/\s*\bsold\s*$/i, '').split(/\s+-\s+/);
      cur = {name: title.toLowerCase(), vin: (vin || '').toUpperCase(), price, date, sold, soldFor: sold ? gMoney(h) : null,
             titleNo: c(10), cost: gMoney(c(5)), paint: /^#[0-9a-f]{3,8}$/i.test(c(11)) ? c(11) : '', plateStyle: c(12).toLowerCase(), parts: [], h: sold ? [] : (h ? [h] : [])};
      out.push(cur);
    } else if (cur && name) {
      cur.parts.push({name: name.toLowerCase(), price, date});
      if (h) cur.h.push(h);
    } else if (cur && !name && h) cur.h.push(h);
  }
  for (const v of out) {
    v.state = (v.h[0] || '').toLowerCase(); v.plate = (v.h[1] || '').toUpperCase(); v.notes = v.h.slice(2).map(x => x.toLowerCase());
    // the sheet's own cost column wins (it can leave things out on purpose); otherwise add it up
    v.total = v.cost != null ? v.cost : (v.price || 0) + v.parts.reduce((t, x) => t + (x.price || 0), 0);
    v.parts.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  }
  return out;
}
function garageHTML(){
  const all = parseGarage(S.garage);
  if (!all.length) return `<header class="top"><h1 class="ttl">garage</h1></header>
    <p class="empty">nothing here yet.<br>your vehicles show up after the next sync.</p>`;
  const act = all.filter(v => !v.sold), sold = all.filter(v => v.sold);
  const tot = act.reduce((t, v) => t + v.total, 0);
  const card = (v, i) => {
    const key = v.vin || v.name, open = !!openVeh[key], own = ageOf(v.date);
    return `<section class="card veh ${open ? 'open' : ''}">
      <button class="vhead" data-act="veh" data-k="${esc(key)}">
        <i class="paint" style="${v.paint ? 'background:' + v.paint : ''}"></i>
        <span class="vmid"><b class="vn">${esc(v.name)}</b>
          <span class="vs"><span class="vc">${fmt$0(v.total)}</span><small>${v.sold ? (v.soldFor != null ? 'sold for ' + fmt$0(v.soldFor) : 'sold') : 'owned ' + own.txt} · ${v.parts.length} item${v.parts.length === 1 ? '' : 's'}</small></span></span>

const mealKey = v => v.toLowerCase().replace(/[^a-z0-9]/g, '');
function mealChips(){
  // ranked by visits in the last 90 days (all-time breaks ties), so spots you've stopped going to drop off
  const since = addDays(todayISO(), -90);
  const m = new Map();
  for (const k in S.days) for (const f of ['m1', 'm2']) {
    const v = (S.days[k][f] || '').trim();
    if (!v || v === '-') continue;
    const key = mealKey(v); if (!key || NEVER_MEALS.includes(key)) continue;
    const o = m.get(key) || {k: key, c: 0, r: 0, last: '', names: new Map()};
    o.c++; if (k >= since) o.r++; if (k > o.last) o.last = k; o.names.set(v, (o.names.get(v) || 0) + 1); m.set(key, o);
  }
  if (!m.size) return DEF_MEALS;
  // jersey mike's is a wednesday thing: only offer it on wednesdays, and put it first then
  const wed = fromISO(sel).getDay() === 3;
  const list = [...m.values()].filter(o => (wed || !WED_ONLY.includes(o.k)) && o.r >= 2).sort((a, b) => b.r - a.r || b.c - a.c);   // one-off visits don't earn a button
  if (wed) list.sort((a, b) => (WED_ONLY.includes(b.k) ? 1 : 0) - (WED_ONLY.includes(a.k) ? 1 : 0));
  const name = o => [...o.names.entries()].sort((a, b) => b[1] - a[1])[0][0];
  const shown = list.slice(0, 14);
  const out = shown.map(name);
  // wildcard: an old favorite (3+ visits) you haven't been to in 30+ days; rotates once a day
  const stale = addDays(todayISO(), -30);
  const pool = [...m.values()].filter(o => o.c >= 3 && !shown.includes(o) && o.last < stale && !WED_ONLY.includes(o.k))
    .sort((a, b) => a.k < b.k ? -1 : 1);
  if (pool.length) {
    const dayNum = Math.round(fromISO(todayISO()) / 864e5);   // cycles through every old favorite before repeating
    out.wild = name(pool[dayNum % pool.length]); out.push(out.wild);
  }
  return out;
}

/* ---------- import / export ---------- */
async function shareOrDownload(name, text, mime){
  const file = new File([text], name, {type: mime});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file]}); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
const csvCell = v => { v = String(v ?? ''); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };

      spendCell(d.cc), spendCell(d.bo), itemsStr(d.cc), itemsStr(d.bo), d.notes || '', hlCell(d)].map(csvCell).join(','));

function parseDelimited(text, dl){

    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"' && f === '') q = true;
    else if (c === dl) { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}
const MONTHS = MON.map(m => m.toLowerCase());
function parseDay(s){
  s = String(s || '').trim().toLowerCase(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/))) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return `${y}-${pad(+m[1])}-${pad(+m[2])}`; }

    if (!m) return null;
    out.push({n: m[1].trim(), a: money(m[2])});

  return out.length && (total == null || sum(out) === total) ? out : null;
}

  return (s.slice(1).match(/[+-]?[^+-]+/g) || []).map(t => ({a: (t[0] === '-' ? -1 : 1) * money(t.replace(/^[+-]/, '')), n: ''}));

  return out;
}
$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const txt = (await f.text()).replace(/^﻿/, '');
  let incoming;
  try {
    if (/^\s*\{/.test(txt)) {
      const o = JSON.parse(txt);
      if (!o || typeof o.days !== 'object') throw new Error('that isn’t a life backup.');
      incoming = o.days;
    } else incoming = fromCSV(txt);
  } catch (err) { alert('couldn’t read that file. ' + err.message); return; }
  const ks = Object.keys(incoming).filter(k => ISO_RE.test(k));
  if (!ks.length) { alert('no days found in that file.'); return; }
  const overlap = ks.filter(k => S.days[k]).length;
  if (!confirm(`import ${ks.length} days${overlap ? `? ${overlap} of them already exist here and will be replaced by the file’s version.` : '?'}`)) return;
  for (const k of ks) { const d = incoming[k]; d.cc = Array.isArray(d.cc) ? d.cc : []; d.bo = Array.isArray(d.bo) ? d.bo : []; S.days[k] = d; markDirty(k); }
  saveNow(); closeSheet(); render(); toast(`imported ${ks.length} days`); sync();
};

/* ---------- events ---------- */
// today and month tabs: left/right arrow keys move between days / months (desktop)
document.addEventListener('keydown', e => {
  if ((view !== 'month' && view !== 'today') || e.metaKey || e.ctrlKey || e.altKey || sheet.classList.contains('open')) return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  const t = todayISO();
  if (view === 'today') {
    if (e.key === 'ArrowLeft') { sel = addDays(sel, -1); render(); e.preventDefault(); }
    else if (e.key === 'ArrowRight' && sel < t) { sel = addDays(sel, 1); render(); e.preventDefault(); }
    return;
  }
  if (e.key === 'ArrowLeft' && selMonth > firstMonth()) { selMonth = addMonths(selMonth, -1); render(); e.preventDefault(); }
  else if (e.key === 'ArrowRight' && selMonth < t.slice(0, 7)) { selMonth = addMonths(selMonth, 1); render(); e.preventDefault(); }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-view]'); if (!el || sheet.contains(el)) return;
  if (el.dataset.view) {
    if (el.dataset.view === 'data') return dataSheet();
    view = el.dataset.view;
    if (view === 'month' && el.classList.contains('tab')) selMonth = sel.slice(0, 7);
    render(); scrollTo(0, 0); return;
  }
  const act = el.dataset.act, t = todayISO();
  if (act === 'prev') { sel = addDays(sel, -1); render(); }
  else if (act === 'next') { if (sel < t) { sel = addDays(sel, 1); render(); } }
  else if (act === 'gotoday') { sel = t; render(); }
  else if (act === 'add') addSheet(el.dataset.acct);
  else if (act === 'sub') { const x = SUBS.find(y => y.n === el.dataset.n); if (x) addSheet('cc', {label: x.n, amount: x.a}); }
  else if (act === 'bill') { const c = labelChips('bo').find(x => x.name === el.dataset.n); if (c) addSheet('bo', {label: c.name, hint: c.show, isAvg: c.avg}); }
  else if (act === 'meal') mealSheet(el.dataset.f);
  else if (act === 'del') {
    const d = ensure(sel), arr = d[el.dataset.acct], i = +el.dataset.i, it = arr[i];
    if (it && confirm(`remove ${fmt$(it.a)}${it.n ? ' (' + it.n + ')' : ''}?`)) { arr.splice(i, 1); save(); render(); }
  }
  else if (act === 'sleep') { const d = ensure(sel); d.s = d.s == null ? 7 : Math.max(0, Math.min(14, d.s + +el.dataset.n)); save(); render(); }
  else if (act === 'wo') { const d = ensure(sel); d.wo = !d.wo; save(); render(); }
  else if (act === 'veh') { openVeh[el.dataset.k] = !openVeh[el.dataset.k]; render(); }
  else if (act === 'copy') { const v = el.dataset.v; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('copied ' + v.toLowerCase().slice(-6)), () => toast('couldn’t copy')); }
  else if (act === 'jump') { const to = document.getElementById(el.dataset.to); if (to) to.scrollIntoView({behavior: 'smooth', block: 'start'}); }
  else if (act === 'mprev') { if (selMonth > firstMonth()) { selMonth = addMonths(selMonth, -1); render(); } }
  else if (act === 'mnext') { if (selMonth < t.slice(0, 7)) { selMonth = addMonths(selMonth, 1); render(); } }
  else if (act === 'goday') { const k = el.dataset.k; if (k <= t) { sel = k; view = 'today'; render(); scrollTo(0, 0); } }
  else if (act === 'data') dataSheet();
  else if (act === 'syncnow') sync();
  else if (act === 'hl') hlSheet();
});
main.addEventListener('input', e => {
  const tg = e.target;
  if (tg.id === 'q') { q = tg.value; $('#hlist').innerHTML = histList(); return; }
  const f = tg.dataset.f; if (!f) return;
  const d = ensure(sel);
  if (f === 'w') { const v = tg.value.trim(), n = parseFloat(v); d.w = v === '' || isNaN(n) ? null : n; }
  else d[f] = tg.value.toLowerCase();
  if (tg.tagName === 'TEXTAREA') autosize(tg);
  save();
});

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800); }

/* ---------- sync with google sheet ---------- */
let syncing = false, again = false, syncT = null, syncState = '', syncErr = '', remoteU = {};
function syncOn(){ return !!(S.meta.sync && S.meta.sync.url && S.meta.sync.key); }
function syncSoon(ms){ if (!syncOn()) return; clearTimeout(syncT); syncT = setTimeout(sync, ms == null ? 1500 : ms); }
function syncLabel(){
  if (syncState === 'syncing') return 'syncing…';
  if (syncState === 'offline') return 'offline · will sync';
  if (syncState === 'error') return 'sync problem · tap to retry';
  if (S.meta.lastSync) { const d = new Date(S.meta.lastSync); return 'synced ' + (d.getHours() % 12 || 12) + ':' + pad(d.getMinutes()) + (d.getHours() < 12 ? 'am' : 'pm'); }
  return 'not synced yet';
}
function setSync(st, err){
  syncState = st; syncErr = err || '';
  const el = document.getElementById('syncline');
  if (el) { el.textContent = syncLabel(); el.classList.toggle('err', st === 'error'); }
}
const numOrNull = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const spendVal = arr => { const c = spendCell(arr); return c === '' || String(c).startsWith('=') ? c : +c; };
function toRow(k, d){
  return [k, d.s ?? '', !!d.wo, d.m1 || '', d.m2 || '', d.mood || '', d.gr || '', d.w ?? '',
    spendVal(d.cc), spendVal(d.bo), itemsStr(d.cc), itemsStr(d.bo), d.notes || '', d.u || Date.now(), hlCell(d)];
}
function fromRow(r){
  const c = i => (r[i] == null ? '' : r[i]);
  const d = {cc: [], bo: []};
  const s = numOrNull(c(1)); if (s != null) d.s = s;
  if (c(2) === true || /^true$/i.test(String(c(2)))) d.wo = true;
  [['m1', 3], ['m2', 4], ['mood', 5], ['gr', 6], ['notes', 12]].forEach(([f, i]) => { const v = String(c(i)).trim(); if (v) d[f] = v; });
  const w = numOrNull(c(7)); if (w != null && w > 0) d.w = w;
  [['cc', 8, 10], ['bo', 9, 11]].forEach(([a, i, j]) => {
    const raw = String(c(i)).trim();
    const terms = parseFormula(raw);
    const tot = terms ? sum(terms) : money(raw);
    const items = parseItems(String(c(j)), tot);
    if (items) d[a] = items; else if (terms) d[a] = terms; else if (tot) d[a] = [{a: tot, n: ''}];
  });
  d.u = +c(13) || 0;
  const hm = String(c(14)).trim().toLowerCase().match(/^(#[0-9a-f]{6})\s*(.*)$/); if (hm) { d.hl = hm[1]; if (hm[2]) d.trip = hm[2]; }
  return d;
}
// One round trip to the sheet's script. Reads the reply as text so a Google error page gives a readable message.
async function talk(body){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 90000);
  let res, text;
  try {
    res = await fetch(S.meta.sync.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body, signal: ctl.signal, redirect: 'follow'});
    text = await res.text();
  } catch (e) {
    if (e && e.name === 'AbortError') { const x = new Error('google took too long to answer'); x.name = 'AbortError'; throw x; }
    throw e;
  } finally { clearTimeout(tm); }
  try { return JSON.parse(text); }
  catch (e) {
    const title = (text.match(/<title[^>]*>([^<]*)/i) || [])[1];
    const plain = text.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    throw new Error(`google sent a page instead of data (status ${res.status}): ` + ((title ? title.trim() + ' — ' : '') + plain).slice(0, 160));
  }
}
async function sync(){
  if (!syncOn()) return false;
  if (syncing) { again = true; return false; }
  if (!navigator.onLine) { setSync('offline'); return false; }
  syncing = true; again = false; clearTimeout(syncT);
  if (saveT) { clearTimeout(saveT); saveT = null; persist(); }
  setSync('syncing');
  const dirty = Object.keys(S.meta.dirty || {});
  const sent = {};
  const rows = dirty.map(k => { const d = S.days[k] || {}; const row = toRow(k, d); sent[k] = row[13]; return row; });
  let ok = false;
  try {
    const body = JSON.stringify({key: S.meta.sync.key, rows});
    let j;
    try { j = await talk(body); }
    catch (e1) { await new Promise(r => setTimeout(r, 1500)); j = await talk(body); }   // one automatic retry
    if (!j.ok) throw new Error(j.error || 'sync failed');
    for (const k of dirty) { const d = S.days[k]; if (!d || (d.u || 0) <= sent[k]) delete S.meta.dirty[k]; }
    let changed = false; remoteU = {};
    for (const r of j.rows || []) {
      const k = String(r[0]).trim(); if (!ISO_RE.test(k)) continue;
      const rd = fromRow(r); remoteU[k] = rd.u;
      if (S.meta.dirty[k]) continue;
      const ld = S.days[k];
      if (!ld ? !blank(rd) : (rd.u || 0) > (ld.u || 0)) { S.days[k] = rd; changed = true; }
    }
    if (Array.isArray(j.garage) && JSON.stringify(j.garage) !== JSON.stringify(S.garage || null)) { S.garage = j.garage; if (view === 'garage') changed = true; }
    S.meta.lastSync = Date.now();
    persist();
    setSync('ok'); ok = true;
    if (changed) {
      const a = document.activeElement;
      const typing = a && main.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.id !== 'q';
      if (!typing) render();
    }
  } catch (e) {
    setSync(e && (e.name === 'AbortError' || e.name === 'TypeError') ? 'offline' : 'error', e && e.message);
  } finally {
    syncing = false;
    if (again) syncSoon(300);
  }
  return ok;
}
async function connectSync(url, key){
  const prev = S.meta.sync;
  S.meta.sync = {url, key}; S.meta.dirty = {};
  const ok = await sync();               // pull first: anything newer in the sheet wins
  if (!ok) { S.meta.sync = prev; persist(); return false; }
  for (const k in S.days) {               // then send up whatever the sheet doesn't have yet
    const d = S.days[k];
    if (!(k in remoteU)) { if (!d.u) d.u = Date.now(); S.meta.dirty[k] = 1; }
    else if ((d.u || 0) > remoteU[k]) S.meta.dirty[k] = 1;
  }
  persist();
  if (Object.keys(S.meta.dirty).length) await sync();
  return true;
}
addEventListener('online', () => sync());
addEventListener('focus', () => { if (!syncing && Date.now() - (S.meta.lastSync || 0) > 5000) sync(); });
setInterval(() => { if (!document.hidden) sync(); }, 60000);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
sync();
})();
